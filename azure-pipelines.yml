trigger:
  - main

resources:
  - repo: self

variables:
  # Nome da Service Connection que você vai criar no Azure DevOps (ver passo a passo abaixo)
  dockerRegistryServiceConnection: 'acr-mundo365'
  imageRepository: 'ws-mundo365'
  containerRegistry: 'acrmundo365.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: Build and Push
    jobs:
      - job: Build
        displayName: Build & Push Job
        pool:
          vmImage: 'ubuntu-latest' # Já compila em Linux/AMD64 automaticamente!
        steps:
          - task: Docker@2
            displayName: Build e Push da Imagem para o ACR
            inputs:
              command: 'buildAndPush'
              repository: '$(imageRepository)'
              dockerfile: '$(dockerfilePath)'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              tags: |
                $(tag)
                latest
